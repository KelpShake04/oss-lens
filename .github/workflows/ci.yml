name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # 테스트는 tests/fixtures 의 결과를 쓰므로 syft·grype·Ollama 설치가 필요 없다.
      - run: pip install -e ".[dev]"
      - run: pytest -q
